name: Deploy site to Cloudflare Workers

# Legacy manual workflow. Production deploys are handled by Cloudflare Workers
# Builds (connected via MCP, build_token "ai scraping stack", root_directory site).
# Keep this only as an emergency manual fallback.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Sync wiki
        working-directory: site
        run: npm run sync:wiki

      - name: Health (build + SEO checks)
        working-directory: site
        run: npm run health

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy