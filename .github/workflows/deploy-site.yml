name: Deploy site to Cloudflare Workers

# NOTE: manual dispatch until a proper token is stored in CLOUDFLARE_API_TOKEN.
# Required token: Cloudflare API token for account e371aed2f8466508f507960f6838aeb1
# with "Workers Script:Edit" + "Workers Assets:Edit" (template: Edit Cloudflare Workers).
# The current token lacks access to the existing Worker 'uacp-site'.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Sync wiki
        working-directory: site
        run: npm run sync:wiki

      - name: Health (build + SEO checks)
        working-directory: site
        run: npm run health

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: site
          command: deploy