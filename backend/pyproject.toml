[project]
name = "platform"
version = "0.1.0"
description = "Universal AI Capability Platform — Knowledge Foundation"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135",
    "uvicorn>=0.34",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "pydantic>=2.12",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "httpx>=0.28",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
platform-generate-wiki = "uaicp.wiki.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uaicp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI dependency injection uses Depends() in defaults by design.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Prose corpus and long string lines are content, not code style.
"src/uaicp/wiki/corpus.py" = ["E501"]
"src/uaicp/wiki/render.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true